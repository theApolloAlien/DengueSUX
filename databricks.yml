bundle:
  name: denguesux-inspection

variables:
  existing_cluster_id:
    description: Existing job-compatible cluster with repository requirements installed
  data_root:
    description: Persistent Unity Catalog Volume path containing the genuine data archives
  table_prefix:
    description: Writable catalog.schema for Delta output tables

resources:
  jobs:
    daily_inspection:
      name: DengueSUX prospective daily inspection refresh
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 15 8 * * ?"
        timezone_id: Asia/Singapore
        pause_status: PAUSED
      tasks:
        - task_key: snapshot_growth_inspection_notices
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/05_daily_inspection.py
            base_parameters:
              data_root: ${var.data_root}
              table_prefix: ${var.table_prefix}
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 60000

sync:
  include:
    - denguesux/*.py
    - scripts/*.py
    - notebooks/*.py
  exclude:
    - .env
    - .env.*
    - data/**
    - output/**
    - .venv/**
    - .venv-prototype/**
    - mlruns/**
    - deck/node_modules/**
