# DengueSUX jobs for Databricks Free Edition (serverless only: no cluster is configured).
# Deploy: databricks bundle deploy --profile denguesux
# Run: databricks bundle run pipeline --profile denguesux
bundle:
  name: denguesux

variables:
  data_root:
    description: Unity Catalog Volume folder holding the source data (see docs/DATABRICKS_SETUP.md)
    default: /Volumes/workspace/denguesux/files/denguesux
  table_prefix:
    description: Writable catalog.schema for the Delta tables
    default: workspace.denguesux

resources:
  jobs:
    pipeline:
      name: DengueSUX pipeline (bronze, silver, gold)
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/run_stage.py
            base_parameters: {stage: bronze, repo_root: "${workspace.file_path}", data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 1800
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./notebooks/run_stage.py
            base_parameters: {stage: silver, repo_root: "${workspace.file_path}", data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 1800
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/run_stage.py
            base_parameters: {stage: gold, repo_root: "${workspace.file_path}", data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 3600

    daily_inspection:
      name: DengueSUX daily inspection refresh
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 15 8 * * ?"
        timezone_id: Asia/Singapore
        pause_status: UNPAUSED  # daily NEA snapshots build the cluster history the open data does not keep; each run uses serverless quota
      tasks:
        - task_key: live_api_autoloader
          notebook_task:
            notebook_path: ./notebooks/06_live_ingestion.py
            base_parameters: {repo_root: "${workspace.file_path}", data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 60000
        - task_key: high_aedes_population
          notebook_task:
            notebook_path: ./notebooks/07_aedes.py
            base_parameters: {repo_root: "${workspace.file_path}", data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 600
          max_retries: 1
        - task_key: snapshot_growth_inspection_notices
          depends_on: [{task_key: live_api_autoloader}, {task_key: high_aedes_population}]
          run_if: ALL_DONE  # still preserve today's cluster snapshot if weather/Auto Loader fails
          notebook_task:
            notebook_path: ./notebooks/05_daily_inspection.py
            base_parameters: {data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: official_and_news_feed
          depends_on: [{task_key: snapshot_growth_inspection_notices}]
          notebook_task:
            notebook_path: ./notebooks/08_activity_feed.py
            base_parameters: {repo_root: "${workspace.file_path}", data_root: "${var.data_root}", table_prefix: "${var.table_prefix}"}
          timeout_seconds: 600
          max_retries: 1

targets:
  dev:
    default: true

sync:
  include:
    - denguesux/*.py
    - scripts/*.py
    - notebooks/*.py
  exclude:
    - .env
    - .env.*
    - data/**
    - output/**
    - .venv/**
    - .venv-prototype/**
    - mlruns/**
    - deck/**
    - demo/**
    - docs/**
    - app/**
    - databricks_app/**
    - tests/**
    - "*.pdf"
