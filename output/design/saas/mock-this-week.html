</style><body class="loading"><aside><strong>DengueSUX</strong><nav><a>This week</a><a>Map</a><a>Field plan</a><a>Forecast</a></nav></aside><main><header><span>This week</span><span id="status">Loading saved snapshot…</span></header><h1><span class="value" id="headline">Areas to check this week</span></h1><div class="grid"><section class="outlook"><span>Expected nationally</span><strong class="value" id="value">—</strong><p id="range">Loading forecast range…</p><p>Past error, not a guarantee.</p></section><section class="rows"><h2>Where to check first</h2><div id="rows"></div></section></div><div class="lower"><span>Places to check, not confirmed breeding sites</span><button onclick="location.reload()">Replay loading</button></div></main><script>
